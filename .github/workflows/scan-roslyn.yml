name: Scan Roslyn

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      reset_sha:
        description: Retry one currently active SHA regardless of saved state
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: roslyn-codewise-scan
  cancel-in-progress: false

env:
  MAX_INDEXES_PER_RUN: "4"
  MAX_ATTEMPTS: "3"
  RETRY_AFTER_HOURS: "12"

jobs:
  scan:
    name: Discover and dispatch
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_INDEXING == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted Codewise source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and build scanner
        run: |
          npm ci
          npm run build:hosted-indexing

      - name: Scan and dispatch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESET_SHA: ${{ inputs.reset_sha }}
        run: |
          node tools/hosted-indexing/dist/cli.js scan --reset-sha "$RESET_SHA"

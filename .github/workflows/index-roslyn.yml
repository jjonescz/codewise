name: Index one Roslyn commit
run-name: Index Roslyn ${{ inputs.source_label }} at ${{ inputs.roslyn_sha }}

on:
  workflow_dispatch:
    inputs:
      roslyn_sha:
        description: Expected Roslyn commit SHA
        required: true
        type: string
      roslyn_ref:
        description: Public Roslyn ref to fetch
        required: true
        type: string
      source_kind:
        description: Roslyn source kind
        required: true
        type: string
      source_label:
        description: Human-readable source label
        required: true
        type: string
      pull_request_number:
        description: Pull request number, empty for main
        required: false
        type: string
      attempt:
        description: Reserved attempt number
        required: true
        type: string

permissions: {}

concurrency:
  group: roslyn-codewise-${{ inputs.roslyn_sha }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  RESULT_RETENTION_DAYS: "90"
  ROSLYN_SOLUTION: Roslyn.slnx

jobs:
  index:
    name: Build and index untrusted Roslyn source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions: {}

    steps:
      - name: Fetch trusted Codewise source anonymously
        shell: bash
        env:
          CODEWISE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init codewise
          git -C codewise remote add origin https://github.com/jjonescz/codewise.git
          git -C codewise fetch --depth=1 origin "$CODEWISE_SHA"
          git -C codewise checkout --detach FETCH_HEAD

      - name: Fetch Roslyn anonymously
        shell: bash
        env:
          ROSLYN_REF: ${{ inputs.roslyn_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$ROSLYN_REF" =~ ^refs/(heads/main|pull/[0-9]+/head)$ ]]; then
            echo "Unsupported Roslyn ref: $ROSLYN_REF" >&2
            exit 1
          fi
          git init roslyn
          git -C roslyn remote add origin https://github.com/dotnet/roslyn.git
          git -C roslyn fetch --depth=1 origin "$ROSLYN_REF"
          git -C roslyn checkout --detach FETCH_HEAD

      - name: Verify Roslyn commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.roslyn_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C roslyn rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Expected $EXPECTED_SHA but checked out $actual_sha" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: codewise/package-lock.json

      - name: Set up Roslyn .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: roslyn/global.json

      - name: Install Codewise and Roslyn language server
        working-directory: codewise
        shell: bash
        run: |
          npm ci
          npm run build:core
          npm run build:crawler
          npm run build:indexer
          dotnet tool restore

      - name: Restore and build Roslyn
        working-directory: roslyn
        shell: bash
        run: |
          ./build.sh \
            --restore \
            --build \
            --ci \
            --binaryLog \
            --skipDocumentation \
            --solution "$ROSLYN_SOLUTION"

      - name: Crawl Roslyn language server and create bundle
        working-directory: codewise
        shell: bash
        env:
          ROSLYN_SHA: ${{ inputs.roslyn_sha }}
        run: |
          set -euo pipefail
          node tools/index-roslyn/dist/cli.js \
            --workspace-root "$GITHUB_WORKSPACE/roslyn" \
            --database "$GITHUB_WORKSPACE/codewise/artifacts/roslyn/$ROSLYN_SHA/index.db"

          artifact_directory="$GITHUB_WORKSPACE/codewise/artifacts/roslyn/$ROSLYN_SHA"
          test -s "$artifact_directory/index.db"
          test -s "$artifact_directory/manifest.json"
          test -s "$artifact_directory/lsp-crawler.log"
          tar -czf "$RUNNER_TEMP/roslyn-codewise.tar.gz" \
            -C "$artifact_directory" \
            index.db manifest.json lsp-crawler.log

      - name: Upload Codewise index bundle
        uses: actions/upload-artifact@v4
        with:
          name: roslyn-codewise-${{ inputs.roslyn_sha }}
          path: ${{ runner.temp }}/roslyn-codewise.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  finalize:
    name: Record trusted result
    needs: index
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out trusted Codewise source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and build finalizer
        run: |
          npm ci
          npm run build:hosted-indexing

      - name: Record result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONCLUSION: ${{ needs.index.result }}
        run: |
          node tools/hosted-indexing/dist/cli.js complete \
            --sha "${{ inputs.roslyn_sha }}" \
            --source-kind "${{ inputs.source_kind }}" \
            --source-ref "${{ inputs.roslyn_ref }}" \
            --source-label "${{ inputs.source_label }}" \
            --pull-request-number "${{ inputs.pull_request_number }}" \
            --attempt "${{ inputs.attempt }}" \
            --conclusion "$CONCLUSION"
